<div class="modal-header">
    <h5 class="modal-title">{{project.name}}</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="bsModalRef.hide()"></button>
</div>
<div class="modal-body">
    <carousel>
        <div *ngFor="let picture of project.pictures">
        <slide><img [src]="picture" alt="slide" style="display: block; width: 100%;"></slide>
        </div>
    </carousel>

    <h3 class="m1-2">Description</h3>
    <p>{{project.description}}</p>
    <p>You can find this project on GitHub <a href={{project.projectLink}} target="_blank">here</a></p>
    <hr>
    <div class="d-flex flex-wrap">
      <div *ngFor="let tag of project.tags" class="tag me-2 mb-1"
           [style.background-color]="tag.color">
        {{tag}}
      </div>
    </div>
</div>
